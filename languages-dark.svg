<svg xmlns="http://www.w3.org/2000/svg" width="350" height="206" viewBox="0 0 350 206" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Most used languages</title>
<desc id="desc">TypeScript 28.7%, PLpgSQL 20.2%, Python 17.7%, JavaScript 14.4%, CSS 5.7%, Java 5.7%, Other 7.6%</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #f0f6fc; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #7d8590; letter-spacing: 0.04em; }
  .secondary { fill: #9198a1; }
  .muted { fill: #7d8590; }
  .icon { fill: #9198a1; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="349" height="205" rx="6" fill="none" stroke="none"/>
<text x="20" y="28" class="col">MOST USED LANGUAGES</text>
<mask id="bar"><rect class="grow" x="20" y="48" width="310" height="10" rx="5" fill="#fff"/></mask>
<g mask="url(#bar)"><rect x="20.00" y="48" width="85.54" height="10" fill="#3178c6"/><rect x="107.54" y="48" width="60.07" height="10" fill="#336790"/><rect x="169.60" y="48" width="52.62" height="10" fill="#3572A5"/><rect x="224.22" y="48" width="42.95" height="10" fill="#f1e05a"/><rect x="269.17" y="48" width="17.04" height="10" fill="#663399"/><rect x="288.22" y="48" width="17.04" height="10" fill="#b07219"/><rect x="307.26" y="48" width="22.74" height="10" fill="#6e7681"/></g>
<g transform="translate(20 84)"><g class="fade" style="animation-delay: 200ms"><circle cx="5" cy="6" r="5" fill="#3178c6"/><text x="16" y="11" class="label">TypeScript <tspan class="secondary">28.7%</tspan></text></g></g>
<g transform="translate(175 84)"><g class="fade" style="animation-delay: 270ms"><circle cx="5" cy="6" r="5" fill="#336790"/><text x="16" y="11" class="label">PLpgSQL <tspan class="secondary">20.2%</tspan></text></g></g>
<g transform="translate(20 116)"><g class="fade" style="animation-delay: 340ms"><circle cx="5" cy="6" r="5" fill="#3572A5"/><text x="16" y="11" class="label">Python <tspan class="secondary">17.7%</tspan></text></g></g>
<g transform="translate(175 116)"><g class="fade" style="animation-delay: 410ms"><circle cx="5" cy="6" r="5" fill="#f1e05a"/><text x="16" y="11" class="label">JavaScript <tspan class="secondary">14.4%</tspan></text></g></g>
<g transform="translate(20 148)"><g class="fade" style="animation-delay: 480ms"><circle cx="5" cy="6" r="5" fill="#663399"/><text x="16" y="11" class="label">CSS <tspan class="secondary">5.7%</tspan></text></g></g>
<g transform="translate(175 148)"><g class="fade" style="animation-delay: 550ms"><circle cx="5" cy="6" r="5" fill="#b07219"/><text x="16" y="11" class="label">Java <tspan class="secondary">5.7%</tspan></text></g></g>
<g transform="translate(20 180)"><g class="fade" style="animation-delay: 620ms"><circle cx="5" cy="6" r="5" fill="#6e7681"/><text x="16" y="11" class="label">Other <tspan class="secondary">7.6%</tspan></text></g></g>
</svg>
